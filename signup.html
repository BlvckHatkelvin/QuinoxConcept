<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="signup.css">
        <title>Quinox Concept Sign up</title>
    </head>
    <body>
        <div class="signup">
            <h3><a href="index.html" id="backhome">QUINOX CONCEPT</a></h3>
            <h2>CREATE YOUR ACCOUNT</h2>
            <P>Get access to new drops and members only collections</P>

            <div id="details">
              <div>  
                 <h3>Full Name</h3>
                 <input type="text" placeholder="Enter your name">
              </div>
              <div>
                 <h3>Email</h3>
                 <input type="email" placeholder="Enter your Email">
              </div>
              <div>
                 <h3>Password</h3>
                 <input type="password" placeholder="Password">
              </div>
            </div>

            <button id="btnnn">GET STARTED</button>

            <p>Already have an account? <a href="login.html">Login</a></p>
             
        </div>
    </body>
</html>
